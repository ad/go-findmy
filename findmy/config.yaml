name: Find My
version: "0.4.0"
slug: findmy
image: ghcr.io/ad/go-findmy-{arch}
description: AirTags and OpenHaystack tags as device_tracker entities, no Mac needed
url: https://github.com/ad/go-findmy
arch:
  - amd64
  - aarch64
init: false
services:
  - mqtt:need
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:map-marker-radius
options:
  poll_interval: 15
schema:
  poll_interval: int(15,)
  timezone: str?
